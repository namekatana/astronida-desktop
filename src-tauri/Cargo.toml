[package]
name = "astronida"
version = "0.1.0"
description = "Astronida desktop client"
edition = "2021"

[lib]
name = "astronida_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
cpal = "0.18"
futures-util = "0.3"
livekit = { version = "0.9", features = ["native-tls"] }
ringbuf = "0.5"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.12.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
